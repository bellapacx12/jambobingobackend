version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: beteseb-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: beteseb_bingo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: beteseb-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: beteseb-backend
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - SERVER_ENV=development
      - DATABASE_URL=postgresql://neondb_owner:npg_SOH8EtoLBNU5@ep-tiny-rice-atokhred-pooler.c-9.us-east-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require
      - DB_MAX_CONNS=25
      - DB_MIN_CONNS=5
      - REDIS_URL=rediss://default:gQAAAAAAARBaAAIgcDEzNmQ5YjlkY2NhOTU0YWI1YWUxYTMyZmJlNDk2ZWM5Mw@advanced-fox-69722.upstash.io:6379
      - REDIS_PASSWORD=
      - REDIS_DB=0
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_BOT_USERNAME=${TELEGRAM_BOT_USERNAME}
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - HMAC_SECRET=${HMAC_SECRET:-change-me-in-production}
      - GAME_LOBBY_DURATION_SECONDS=30
      - GAME_BALL_DROP_INTERVAL_MIN_MS=3000
      - GAME_BALL_DROP_INTERVAL_MAX_MS=5000
      - GAME_MAX_PLAYERS_PER_ROOM=500
      - GAME_PRIZE_POOL_MULTIPLIER=0.85
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
